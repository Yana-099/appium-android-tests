[pytest]
testpaths = tests
addopts = -ra --alluredir=allure-results --clean-alluredir
markers =
    ai_generated: UI scenario drafted from a Qase case and reviewed before inclusion
    smoke: critical checks for the main user flow
    regression: extended functional checks
    negative: negative scenarios and validation checks
    crash_demo: intentionally failing demonstration of app crash diagnostics
    visual: visual regression checks for a fixed emulator profile
