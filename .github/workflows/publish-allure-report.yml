name: Publish Allure report

on:
  workflow_run:
    workflows: ["Android UI tests (self-hosted)"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish Allure report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Скачать Allure-результаты текущего запуска
        id: download_allure
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: allure-and-artifacts-${{ github.event.workflow_run.run_number }}
          path: downloaded-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Проверить наличие Allure-результатов
        id: allure_results
        if: ${{ always() }}
        run: |
          if [ -d downloaded-artifact/allure-results ] && find downloaded-artifact/allure-results -type f -name '*-result.json' -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Установить Allure CLI
        if: ${{ steps.allure_results.outputs.available == 'true' }}
        env:
          ALLURE_VERSION: 2.46.1
        run: |
          curl -fsSL -o allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz

      - name: Собрать HTML-отчёт Allure
        if: ${{ steps.allure_results.outputs.available == 'true' }}
        env:
          ALLURE_VERSION: 2.46.1
        run: |
          ./allure-${ALLURE_VERSION}/bin/allure generate downloaded-artifact/allure-results --clean --output allure-report

      - name: Подготовить страницу при отсутствии Allure-результатов
        if: ${{ steps.allure_results.outputs.available != 'true' }}
        run: |
          mkdir -p allure-report
          cp .github/allure-report-unavailable.html allure-report/index.html

      - name: Подготовить GitHub Pages
        uses: actions/configure-pages@v6

      - name: Загрузить отчёт для GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Опубликовать отчёт
        id: deployment
        uses: actions/deploy-pages@v4
