name: Android UI tests (self-hosted)

on:
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Группа тестов для запуска"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
          - negative
          - known_bug
          - demo_three

concurrency:
  group: android-emulator-5554
  cancel-in-progress: false

jobs:
  run-ui-tests:
    name: Run ${{ inputs.test_scope }} tests
    runs-on: [self-hosted, windows, appium]
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File {0}

    steps:
      - name: Получить код проекта
        uses: actions/checkout@v6

      - name: Проверить локальный Python
        run: |
          python --version
          python -m pip --version

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Проверить Appium и Android-эмулятор
        run: |
          Invoke-RestMethod -Uri "http://127.0.0.1:4723/status" | Out-Null
          $device = & adb devices | Select-String -Pattern "^emulator-5554\s+device$"
          if (-not $device) {
            throw "Устройство emulator-5554 не найдено через ADB."
          }

      - name: Запустить выбранную группу тестов
        id: run_tests
        run: |
          # Создаём каталог для вывода pytest и будущих артефактов.
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          # Для демонстрации запускаем три фиксированных стабильных сценария.
          if ("${{ inputs.test_scope }}" -eq "demo_three") {
            python -m pytest `
              tests/login/test_login_form.py `
              tests/login/test_amt_1_valid_login.py `
              tests/login/test_amt_2_logout.py -v 2>&1 | Tee-Object -FilePath artifacts/pytest-output.txt
          }
          else {
            python -m pytest -m "${{ inputs.test_scope }}" -v 2>&1 | Tee-Object -FilePath artifacts/pytest-output.txt
          }

          # Сохраняем результат pytest, чтобы следующие шаги выполнились даже при падении тестов.
          $pytestExitCode = $LASTEXITCODE
          "exit_code=$pytestExitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit $pytestExitCode

      - name: Отправить итоги прогона в Telegram
        if: ${{ always() && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TEST_SCOPE: ${{ inputs.test_scope }}
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Читаем сохранённый вывод pytest для подсчёта результатов.
          $pytestOutput = Get-Content -Raw -Path artifacts/pytest-output.txt -ErrorAction SilentlyContinue
          $passed = 0
          $failed = 0
          $passedMatch = [regex]::Match($pytestOutput, "(?<!\d)(\d+) passed")
          $failedMatch = [regex]::Match($pytestOutput, "(?<!\d)(\d+) failed")

          if ($passedMatch.Success) { $passed = $passedMatch.Groups[1].Value }
          if ($failedMatch.Success) { $failed = $failedMatch.Groups[1].Value }

          # Формируем понятное сообщение для Telegram.
          if ($env:TEST_OUTCOME -eq "success") {
            $status = "✅ Успешно"
          }
          else {
            $status = "❌ Есть ошибки"
          }

          $message = @"
Android UI tests
Статус: $status
Набор: $env:TEST_SCOPE
Passed: $passed
Failed: $failed
Запуск: $env:RUN_URL
"@

          python tools/send_telegram_report.py --message "$message"

      - name: Сохранить Allure-результаты и артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-and-artifacts-${{ github.run_number }}
          path: |
            allure-results/
            artifacts/
          if-no-files-found: warn
          retention-days: 14
